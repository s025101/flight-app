<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Gate Information Display System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* --- 左側：管理パネル --- */
    .admin-panel {
      width: 380px;
      background-color: #f4f5f7;
      color: #333;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #333;
      transition: margin-left 0.3s ease;
      flex-shrink: 0;
    }
    .admin-panel.collapsed {
      margin-left: -380px;
    }

    .toggle-panel-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background-color 0.2s;
    }
    .toggle-panel-btn:hover { background-color: #003d99; }

    .admin-panel h3 {
      margin-top: 30px;
      color: #0052cc;
      border-bottom: 2px solid #0052cc;
      padding-bottom: 5px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: white;
    }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    
    button.btn-primary {
      width: 100%;
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn-primary:hover { background-color: #003d99; }

    button.btn-mode {
      width: 100%;
      background-color: #d97706;
      color: white;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    button.btn-mode:hover { background-color: #b45309; }
    
    button.btn-secondary {
      width: 100%;
      background-color: #4a5568;
      color: white;
      border: none;
      padding: 6px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 4px;
    }
    button.btn-secondary:hover { background-color: #2d3748; }

    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #0052cc;
      margin-top: 15px;
      margin-bottom: 8px;
      border-left: 4px solid #0052cc;
      padding-left: 6px;
    }

    /* --- 右側：案内板表示エリア --- */
    .display-panel {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0d16;
      position: relative;
    }

    .fids-board {
      width: 100%;
      height: 100%;
      max-width: 1150px;
      max-height: 650px;
      background-color: #12121f;
      border: 4px solid #222238;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* 準備中モード画面 */
    .standby-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #12121f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }
    .standby-screen.hidden { display: none; }
    .standby-logo-box {
      width: 100%;
      height: 100%;
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .standby-logo-box img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* ヘッダー領域 (Gate, 状態, 時計) */
    .row-header {
      height: 18%;
      background-color: #1b1b2f;
      display: flex;
      border-bottom: 3px solid #2a2a44;
    }
    .gate-block {
      width: 18%;
      background-color: #24dc62; /* 写真のような鮮やかな緑帯 */
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }
    .gate-label { font-size: 0.9rem; text-transform: uppercase; line-height: 1; }
    .gate-number { font-size: 3.2rem; line-height: 1; }

    .title-block {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background-color: #1b1b2f;
    }
    .title-text-ja { font-size: 2.5rem; font-weight: bold; letter-spacing: 0.2rem; }
    .title-text-en { font-size: 1.2rem; color: #ffcc00; font-weight: bold; display: none; } /* 写真に合わせて非表示か小さく */

    .clock-block {
      width: 20%;
      background-color: #1b1b2f;
      display: flex;
      justify-content: center;
      align-items: center;
      border-left: 3px solid #2a2a44;
    }
    .clock-time { font-size: 3.0rem; font-weight: bold; font-family: monospace; }

    /* メイン領域 (行先、コードシェア便情報、天気) */
    .row-main {
      flex-grow: 1;
      display: flex;
      padding: 20px 30px;
      align-items: center;
    }
    .main-left {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
    }
    
    .destination-container { display: flex; align-items: baseline; gap: 15px; }
    .destination-text-ja { font-size: 5.0rem; font-weight: bold; line-height: 1; }

    /* コードシェアを並べるコンテナ */
    .flights-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .flight-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .airline-logo-box {
      height: 48px;
      width: 80px;
      background-color: white;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .airline-logo-box img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    .flight-number { font-size: 3.2rem; font-weight: bold; line-height: 1; }

    /* 右側：天気ブロック */
    .main-right {
      width: 220px;
      border-left: 2px solid #2a2a44;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .weather-icon-box { font-size: 3.8rem; line-height: 1; }
    .weather-temps { font-size: 1.8rem; font-weight: bold; margin-top: 5px; color: #fff; }
    .weather-temps span.min { color: #8ab4f8; font-size: 1.4rem; }

    /* 下部：時刻・遅延情報エリア */
    .row-time {
      height: 22%;
      background-color: #161628;
      display: flex;
      align-items: center;
      padding: 0 30px;
      border-top: 3px solid #2a2a44;
      gap: 20px;
    }
    .time-display-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .time-label { font-size: 1.1rem; color: #aaa; font-weight: bold; }
    .time-original { font-size: 3.0rem; font-weight: bold; text-decoration: line-through; color: #888; }
    .time-arrow { font-size: 2.2rem; color: #ffcc00; font-weight: bold; }
    .time-changed-label { font-size: 0.9rem; background-color: #d97706; color: white; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
    .time-changed-value { font-size: 3.5rem; font-weight: bold; color: #ffcc00; }

    /* 最下部：おしらせスクロール帯 */
    .row-notice {
      height: 15%;
      background-color: #ffd700; /* 写真のような黄色い帯 */
      color: #111;
      font-size: 2.0rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      padding: 0 20px;
      overflow: hidden;
      white-space: nowrap;
    }
    .notice-text {
      display: inline-block;
    }

    @keyframes blinkAnimation {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    .blink { animation: blinkAnimation 1.2s infinite; }
  </style>
</head>
<body>

  <!-- パネル開閉ボタン -->
  <button type="button" class="toggle-panel-btn" id="btnTogglePanel" onclick="toggleAdminPanel()">
    ◀ パネルを閉じる
  </button>

  <!-- 左側: コントロールパネル -->
  <div class="admin-panel" id="adminPanel">
    <h3>コントロールパネル</h3>
    
    <button type="button" class="btn-mode" id="btnToggleMode" onclick="toggleStandbyMode()">
      📺 準備中画面（ロゴ表示）に切り替え
    </button>

    <div class="section-title">✏️ 表示設定・調整</div>
    <form id="adminForm">
      
      <div class="row">
        <div class="form-group">
          <label>ゲート番号</label>
          <input type="text" id="gate" value="82">
        </div>
        <div class="form-group">
          <label>ステータス</label>
          <select id="title_select">
            <option value="搭乗中" selected>搭乗中 (NOW BOARDING)</option>
            <option value="搭乗ご案内">搭乗ご案内 (BOARDING)</option>
            <option value="最終案内">最終案内 (FINAL CALL)</option>
            <option value="出発遅延">出発遅延 (DELAYED)</option>
            <option value="欠航">欠航 (CANCELLED)</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>行き先空港名</label>
        <select id="destination" onchange="autoFetchWeather()">
          <option value="福江" selected>福江 (GOTO FUKUE)</option>
          <option value="新千歳">新千歳</option>
          <option value="羽田">羽田</option>
          <option value="伊丹">伊丹</option>
          <option value="福岡">福岡</option>
          <option value="那覇">那覇</option>
        </select>
      </div>

      <div class="section-title">✈️ 運航会社・便名 (メイン)</div>
      <div class="row">
        <div class="form-group">
          <label>航空会社コード</label>
          <input type="text" id="airline_code" value="ORC">
        </div>
        <div class="form-group">
          <label>便名</label>
          <input type="text" id="flight_no" value="ORC97">
        </div>
      </div>

      <div class="section-title">🤝 コードシェア便 (2社目・任意)</div>
      <div class="row">
        <div class="form-group">
          <label>コードシェア会社コード</label>
          <input type="text" id="co_airline_code" value="ANA">
        </div>
        <div class="form-group">
          <label>コードシェア便名</label>
          <input type="text" id="co_flight_no" value="ANA4697">
        </div>
      </div>

      <div class="section-title">⏰ 時刻・遅延設定</div>
      <div class="row">
        <div class="form-group">
          <label>定刻 (STD)</label>
          <input type="text" id="departure_time" value="9:35">
        </div>
        <div class="form-group">
          <label>変更時刻 (遅延時など)</label>
          <input type="text" id="changed_time" value="9:45">
        </div>
      </div>
      <div class="form-group">
        <label>搭乗開始時刻</label>
        <input type="text" id="boarding_time" value="9:15">
      </div>

      <div class="section-title">🌤️ 天気・お知らせ</div>
      <div class="row">
        <div class="form-group">
          <label>最高気温</label>
          <input type="text" id="weather_temp" value="21°C">
        </div>
        <div class="form-group">
          <label>最低気温</label>
          <input type="text" id="weather_temp_min" value="12°C">
        </div>
      </div>
      <div class="form-group">
        <label>下部おしらせメッセージ</label>
        <input type="text" id="notice_message" value="おくれ（使用機到着遅れのため）">
      </div>

      <button type="button" class="btn-primary" onclick="sendUpdate()">設定を案内に反映</button>
    </form>
  </div>

  <!-- 右側: 案内板表示部 -->
  <div class="display-panel">
    <div class="fids-board">
      
      <!-- 準備中画面 -->
      <div class="standby-screen hidden" id="standbyScreen">
        <div class="standby-logo-box">
          <img src="" id="disp_standby_logo" alt="AIRLINE LOGO" onerror="handleImageError(this)">
        </div>
      </div>

      <!-- ヘッダー -->
      <div class="row-header">
        <div class="gate-block">
          <span class="gate-label">GATE</span>
          <span class="gate-number" id="disp_gate">-</span>
        </div>
        <div class="title-block" id="disp_title_block">
          <span class="title-text-ja" id="disp_title_ja">搭乗中</span>
        </div>
        <div class="clock-block"><span class="clock-time" id="disp_clock">00:00</span></div>
      </div>

      <!-- メイン (行き先・便名・天気) -->
      <div class="row-main">
        <div class="main-left">
          <div class="destination-container">
            <span class="destination-text-ja" id="disp_dest_ja">-</span>
          </div>
          <!-- 2社並びのコードシェア表示エリア -->
          <div class="flights-container" id="disp_flights_container">
            <!-- 動的にJSで挿入されます -->
          </div>
        </div>

        <div class="main-right">
          <div class="weather-icon-box" id="disp_weather_icon">☀️</div>
          <div class="weather-temps">
            <span id="disp_weather_temp">21°C</span> │ <span class="min" id="disp_weather_temp_min">12°C</span>
          </div>
        </div>
      </div>

      <!-- 時間・変更時刻表示エリア -->
      <div class="row-time">
        <div class="time-display-box">
          <span class="time-label">定刻</span>
          <span class="time-original" id="disp_departure_time">9:35</span>
          <span class="time-arrow">➔</span>
          <span class="time-changed-label">変更時刻</span>
          <span class="time-changed-value" id="disp_changed_time">9:45</span>
        </div>
      </div>

      <!-- 最下部おしらせスクロール -->
      <div class="row-notice">
        <div class="notice-text" id="disp_notice">おくれ（使用機到着遅れのため）</div>
      </div>

    </div>
  </div>

  <script>
    const IATA_MAP = {
      "ANA": "NH", "JAL": "JL", "SKY": "BC", "SFJ": "7G", "ADO": "HD",
      "SNJ": "6J", "APJ": "MM", "JJP": "GK", "SJO": "IJ", "TZP": "ZG",
      "AJX": "NQ", "FDA": "JH", "IBX": "FW", "JTA": "NU", "RAC": "RAC",
      "JAC": "JC", "HAC": "HC", "ORC": "OC", "AMX": "AH", "TOK": "BV"
    };

    let isStandby = false;
    let isPanelOpen = true;

    function toggleAdminPanel() {
      isPanelOpen = !isPanelOpen;
      const panel = document.getElementById('adminPanel');
      const btn = document.getElementById('btnTogglePanel');
      if (isPanelOpen) {
        panel.classList.remove('collapsed');
        btn.innerText = "◀ パネルを閉じる";
      } else {
        panel.classList.add('collapsed');
        btn.innerText = "▶ パネルを開く";
      }
    }

    function toggleStandbyMode() {
      isStandby = !isStandby;
      const standbyScreen = document.getElementById('standbyScreen');
      const btn = document.getElementById('btnToggleMode');
      if (isStandby) {
        standbyScreen.classList.remove('hidden');
        btn.innerText = "📺 通常の案内板画面に戻す";
        btn.style.backgroundColor = "#2563eb";
      } else {
        standbyScreen.classList.add('hidden');
        btn.innerText = "📺 準備中画面（ロゴ表示）に切り替え";
        btn.style.backgroundColor = "#d97706";
      }
    }

    function getLogoImgTag(airlineCode) {
      const iata = IATA_MAP[airlineCode] || airlineCode.toLowerCase();
      return `<div class="airline-logo-box"><img src="https://images.kiwi.com/airlines/128x128/${iata}.png" alt="${airlineCode}"></div>`;
    }

    async function autoFetchWeather() {
      const destJa = document.getElementById('destination').value;
      try {
        const res = await fetch(`/api/weather?destination=${encodeURIComponent(destJa)}`);
        const weatherData = await res.json();
        if (weatherData) {
          document.getElementById('weather_temp').value = weatherData.temp || '21°C';
        }
      } catch (e) {
        console.error('天気取得エラー:', e);
      }
    }

    function renderData(data) {
      if (!data) return;
      document.getElementById('disp_gate').innerText = data.gate || '';
      document.getElementById('disp_title_ja').innerText = data.title_ja || '';
      document.getElementById('disp_dest_ja').innerText = data.destination_ja || '';

      // コードシェア便のHTML生成（メイン＋存在すれば2社目）
      let flightsHtml = `
        <div class="flight-group">
          ${getLogoImgTag(data.airline_code || 'ANA')}
          <div class="flight-number">${data.flight_no || ''}</div>
        </div>
      `;
      if (data.co_airline_code && data.co_flight_no) {
        flightsHtml += `
          <div class="flight-group">
            ${getLogoImgTag(data.co_airline_code)}
            <div class="flight-number">${data.co_flight_no}</div>
          </div>
        `;
      }
      document.getElementById('disp_flights_container').innerHTML = flightsHtml;

      // 時刻・変更時刻
      document.getElementById('disp_departure_time').innerText = data.departure_time || '';
      document.getElementById('disp_changed_time').innerText = data.changed_time || '';

      // 天気
      document.getElementById('disp_weather_icon').innerText = data.weather_icon || '☀️';
      document.getElementById('disp_weather_temp').innerText = data.weather_temp || '';
      document.getElementById('disp_weather_temp_min').innerText = data.weather_temp_min || '';

      // お知らせメッセージ
      document.getElementById('disp_notice').innerText = data.notice_message || '';

      // スンバイ用ロゴ
      const mainAirline = data.airline_code || "ANA";
      const iata = IATA_MAP[mainAirline] || mainAirline.toLowerCase();
      document.getElementById('disp_standby_logo').src = `https://images.kiwi.com/airlines/128x128/${iata}.png`;
    }

    async function sendUpdate() {
      let updatedData = {
        gate: document.getElementById('gate').value,
        title_ja: document.getElementById('title_select').value,
        destination_ja: document.getElementById('destination').value,
        airline_code: document.getElementById('airline_code').value,
        flight_no: document.getElementById('flight_no').value,
        co_airline_code: document.getElementById('co_airline_code').value,
        co_flight_no: document.getElementById('co_flight_no').value,
        departure_time: document.getElementById('departure_time').value,
        changed_time: document.getElementById('changed_time').value,
        boarding_time: document.getElementById('boarding_time').value,
        weather_icon: document.getElementById('disp_weather_icon').innerText,
        weather_temp: document.getElementById('weather_temp').value,
        weather_temp_min: document.getElementById('weather_temp_min').value,
        notice_message: document.getElementById('notice_message').value
      };

      try {
        const res = await fetch('/api/update-flight-data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedData)
        });
        const result = await res.json();
        renderData(result);
      } catch (e) {
        console.error('更新エラー:', e);
      }
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('disp_clock').innerText = `${h}:${m}`;
    }

    window.onload = async function() {
      updateClock();
      setInterval(updateClock, 1000);

      try {
        const res = await fetch('/api/flight-data');
        const data = await res.json();
        renderData(data);
      } catch (e) {
        console.error('初期データ取得エラー:', e);
      }
    }
  </script>
</body>
</html>
