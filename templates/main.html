<!DOCTYPE html>
<html lang="ja">
<head>
  <script src="destinations.js"></script>
  <meta charset="UTF-8">
  <title>Gate Information Display System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      font-family: 'UD Shin Go', 'Shin Go', 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* --- 左側：管理パネル --- */
    .admin-panel {
      width: 400px;
      background-color: #f4f5f7;
      color: #333;
      padding: 20px;
      overflow-y: auto;
      border-right: 2px solid #333;
      transition: margin-left 0.3s ease;
      flex-shrink: 0;
      z-index: 20;
    }
    .admin-panel.collapsed {
      margin-left: -400px;
    }

    .toggle-panel-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: background-color 0.2s;
    }
    .toggle-panel-btn:hover { background-color: #003d99; }

    .admin-panel h3 {
      margin-top: 30px;
      color: #0052cc;
      border-bottom: 2px solid #0052cc;
      padding-bottom: 5px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #555;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: white;
    }
    .row { display: flex; gap: 8px; }
    .row .form-group { flex: 1; }
    
    button.btn-primary {
      width: 100%;
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn-primary:hover { background-color: #003d99; }

    button.btn-mode {
      width: 100%;
      background-color: #d97706;
      color: white;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
    }
    button.btn-mode:hover { background-color: #b45309; }

    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #0052cc;
      margin-top: 15px;
      margin-bottom: 8px;
      border-left: 4px solid #0052cc;
      padding-left: 6px;
    }

    /* --- 右側：案内板表示エリア --- */
    .display-panel {
      flex-grow: 1;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0d16;
      position: relative;
    }

    .fids-board {
      width: 100%;
      height: 100%;
      max-width: 1150px;
      max-height: 650px;
      background-color: #12121f;
      border: 4px solid #222238;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      color: white;
      position: relative;
      overflow: hidden;
    }

    /* 準備中モード画面 */
    .standby-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #12121f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 10;
    }
    .standby-screen.hidden { display: none; }
    .standby-logo-box {
      width: 100%;
      height: 100%;
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .standby-logo-box img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* ヘッダー領域 (Gate, 状態, 時計) */
    .row-header {
      height: 18%;
      background-color: #1b1b2f;
      display: flex;
      border-bottom: 3px solid #2a2a44;
    }

    .gate-block {
      width: 18%;
      background-color: #24dc62;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 900;
    }
    .gate-label { font-size: 0.9rem; text-transform: uppercase; line-height: 1; letter-spacing: 0.05em; }
    .gate-number { font-size: 3.2rem; line-height: 1; font-weight: 900; }

    .title-block {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background-color: #1b1b2f;
      padding: 0 15px;
    }
    .title-text-ja { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.1rem; line-height: 1; color: #ffffff; }
    .title-text-en { font-size: 1.5rem; color: #ffcc00; font-weight: 900; letter-spacing: 0.05rem; line-height: 1; }

    .title-block.alert-text .title-text-ja,
    .title-block.alert-text .title-text-en {
      color: #ffd700 !important;
    }

    .clock-block {
      width: 20%;
      background-color: #1b1b2f;
      display: flex;
      justify-content: center;
      align-items: center;
      border-left: 3px solid #2a2a44;
    }
    .clock-time { font-size: 3.0rem; font-weight: bold; font-family: 'Courier New', Courier, monospace; }

    /* メイン領域 */
    .row-main {
      flex-grow: 1;
      display: flex;
      padding: 20px 30px;
      align-items: center;
    }
    .main-left {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      min-width: 0;
    }
    
    .destination-container { 
      display: flex; 
      align-items: baseline; 
      gap: 20px; 
      flex-wrap: nowrap; 
      min-width: 0; 
    }
    .destination-text-ja { 
      font-size: 4.5rem; 
      font-weight: 900; 
      line-height: 1; 
      letter-spacing: 0.05em; 
      white-space: nowrap; 
    }
    .destination-text-en { 
      font-size: 2.2rem; 
      color: #aaa; 
      font-weight: bold; 
      line-height: 1; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }

    .flights-container {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .flight-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .airline-logo-box {
      height: 48px;
      width: 80px;
      background-color: white;
      padding: 3px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .airline-logo-box img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    .flight-number { font-size: 3.2rem; font-weight: 900; line-height: 1; letter-spacing: 0.05em; }

    .main-right {
      width: 220px;
      border-left: 2px solid #2a2a44;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .weather-icon-box { font-size: 3.5rem; line-height: 1; }
    .weather-temps { font-size: 1.6rem; font-weight: bold; margin-top: 8px; color: #fff; text-align: center; }
    .weather-temps span.min { color: #8ab4f8; font-size: 1.3rem; }

    .row-time {
      height: 22%;
      background-color: #161628;
      display: flex;
      align-items: center;
      padding: 0 30px;
      border-top: 3px solid #2a2a44;
      gap: 20px;
    }
    .time-display-box {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .time-label { font-size: 1.1rem; color: #aaa; font-weight: bold; }
    .time-original { font-size: 3.0rem; font-weight: 900; }
    .time-original.has-change { text-decoration: line-through; color: #888; }
    .time-arrow { font-size: 2.2rem; color: #ffcc00; font-weight: bold; }
    .time-changed-label { font-size: 0.9rem; background-color: #d97706; color: white; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
    .time-changed-value { font-size: 3.5rem; font-weight: 900; color: #ffcc00; }

    .row-notice {
      height: 15%;
      background-color: #ffd700;
      color: #111;
      font-size: 2.0rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      padding: 0 20px;
      overflow: hidden;
      white-space: nowrap;
      transition: all 0.3s ease;
    }
    .row-notice.hidden-notice {
      height: 0;
      padding: 0 20px;
      border-top: none;
      opacity: 0;
      overflow: hidden;
    }
    .notice-text { display: inline-block; }

    @keyframes blinkAnimation {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }
    .blink { animation: blinkAnimation 1.0s infinite; }

    .status-yellow-blink {
      color: #ffeb3b !important;
      animation: blinkAnimation 1.0s infinite;
    }

    @media screen and (max-width: 768px) {
      .destination-text-ja {
        font-size: 3.2rem;
      }
      .destination-text-en {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

              <option value="CBH">CBH (首都航空)</option>
              <option value="CDG">CDG (山東航空)</option>
              <option value="MXD">MXD (バティック・エア・マレーシア)</option>
              <option value="AXM">AXM (エアアジア)</option>
              <option value="LNI">LNI (タイ・ライオン・エア)</option>
              <option value="TTW">TTW (タイガーエア台湾)</option>
              <option value="ABL">ABL (エアプサン)</option>
              <option value="KOW">KOW (エアロK)</option>
              <option value="CHH">CHH (海南航空)</option>
              <option value="CRK_HKG">HX (香港航空)</option> 
              <option value="APZ">APZ (エアプレミア)</option>
            </optgroup>
            <optgroup label="海外航空会社（北米・欧州・オセアニア）">
              <option value="UAL">UAL (ユナイテッド航空)</option>
              <option value="DAL">DAL (デルタ航空)</option>
              <option value="AAL">AAL (アメリカン航空)</option>
              <option value="ACA">ACA (エア・カナダ)</option>
              <option value="BAW">BAW (ブリティッシュ・エアウェイズ)</option>
              <option value="VIR">VIR (ヴァージン・アトランティック航空)</option>
              <option value="AFR">AFR (エールフランス)</option>
              <option value="DLH">DLH (ルフトハンザドイツ航空)</option>
              <option value="SWR">SWR (スイスインターナショナルエアラインズ)</option>
              <option value="AUA">AUA (オーストリア航空)</option>
              <option value="FIN">FIN (フィンエアー)</option>
              <option value="KLM">KLM (KLMオランダ航空)</option>
              <option value="SAS">SAS (スカンジナビア航空)</option>
              <option value="ANZ">ANZ (ニュージーランド航空)</option>
              <option value="QFA">QFA (カンタス航空)</option>
              <option value="JST">JST (ジェットスター)</option>
              <option value="HAW">HAW (ハワイアン航空)</option>
              <option value="RAM">RAM (ロイヤル・エア・モロッコ)</option> 
              <option value="ITY">ITY (ITAエアウェイズ)</option>
              <option value="THY">THY (ターキッシュ・エアラインズ)</option>
              <option value="ETH">ETH (エチオピア航空)</option>
              <option value="AMX_MEX">AMX (アエロメヒコ航空)</option> 
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label>コードシェア便名</label>
          <input type="text" id="co_flight_no" value="">
        </div>
      </div>

      <div class="section-title">定刻・変更時刻</div>
      <div class="row">
        <div class="form-group">
          <label>定刻</label>
          <input type="text" id="departure_time" value="9:00">
        </div>
        <div class="form-group">
          <label>変更時刻</label>
          <input type="text" id="changed_time" value="">
        </div>
      </div>

      <div class="section-title">お知らせ</div>
      <div class="form-group">
        <label>メッセージ（選択）</label>
        <select id="notice_select" onchange="document.getElementById('notice_message').value = this.value;">
          <option value="" selected>（選択してください）</option>
          <option value="おくれ（使用機材到着おくれのため）">おくれ（使用機材到着おくれのため）</option>
          <option value="おくれ（天候不良のため）">おくれ（天候不良のため）</option>
          <option value="おくれ（機材調整のため）">おくれ（機材調整のため）</option>
          <option value="おくれ（整備作業のため）">おくれ（整備作業のため）</option>
          <option value="ただいま優先搭乗を実施しております">ただいま優先搭乗を実施しております</option>
          <option value="搭乗口が変更になっておりますのでご注意ください">搭乗口が変更になっておりますのでご注意ください</option>
          <option value="天候不良のため、条件付きで運航しております">天候不良のため、条件付きで運航しております</option>
          <option value="天候調査中">天候調査中</option>
          <option value="引き返しまたは出発地への戻りの可能性がございます">引き返しまたは出発地への戻りの可能性がございます</option>
        </select>
      </div>
      <div class="form-group">
        <label>メッセージ（入力）</label>
        <input type="text" id="notice_message" value="" placeholder="直接入力もできます">
      </div>

      <button type="button" class="btn-primary" onclick="sendUpdate()">設定を案内に反映</button>
    </form>
  </div>

  <div class="display-panel">
    <div class="fids-board">
      
      <div class="standby-screen hidden" id="standbyScreen">
        <div class="standby-logo-box">
          <img src="" id="disp_standby_logo" alt="AIRLINE LOGO" onerror="handleLogoError(this)">
        </div>
      </div>

      <div class="row-header" id="disp_header_row">
        <div class="gate-block">
          <span class="gate-label">GATE</span>
          <span class="gate-number" id="disp_gate">-</span>
        </div>
        <div class="title-block" id="disp_title_block">
          <span class="title-text-ja" id="disp_title_ja">搭乗中</span>
          <span class="title-text-en" id="disp_title_en">NOW BOARDING</span>
        </div>
        <div class="clock-block"><span class="clock-time" id="disp_clock">00:00</span></div>
      </div>

      <div class="row-main">
        <div class="main-left">
          <div class="destination-container">
            <span class="destination-text-ja" id="disp_dest_ja">-</span>
            <span class="destination-text-en" id="disp_dest_en">-</span>
          </div>
          <div class="flights-container" id="disp_flights_container"></div>
        </div>

        <div class="main-right">
          <div class="weather-icon-box" id="disp_weather_icon">☀️</div>
          <div class="weather-temps">
            <span id="disp_weather_temp">--°C</span><br>
            <span class="min" id="disp_weather_temp_min">--°C</span>
          </div>
        </div>
      </div>

      <div class="row-time">
        <div class="time-display-box" id="disp_time_container">
          <span class="time-label">定刻</span>
          <span class="time-original" id="disp_departure_time">7:35</span>
        </div>
      </div>

      <div class="row-notice" id="disp_notice_row">
        <div class="notice-text" id="disp_notice"></div>
      </div>

    </div>
  </div>

  <script>
    const AIRLINE_PREFIX = {
      "ANA": "NH", "JAL": "JL", "SKY": "BC", "SFJ": "7G", "ADO": "HD",
      "SNJ": "6J", "APJ": "MM", "JJP": "GK", "SJO": "IJ", "FDA": "JH",
      "IBX": "FW", "JTA": "NU", "RAC": "RA", "JAC": "JC", "HAC": "HC",
      "ORC": "OC", "AHX": "RX", "TOK": "BV", "ZIP": "ZG", "AJX": "NQ",
      "KAL": "KE", "AAR": "OZ", "JNA": "LJ", "TWB": "TW", "JJA": "7C",
      "CAL": "CI", "EVA": "BR", "SLI": "JX", "CCA": "CA", "CSN": "CZ",
      "CES": "MU", "CXA": "MF", "SGH": "HO", "CQH": "9C", "CPA": "CX",
      "HKE": "UO", "CRK": "HB", "SIA": "SQ", "SCO": "TR", "MAS": "MH",
      "THA": "TG", "TAX": "XJ", "VNA": "VN", "VJC": "VJ", "PAL": "PR",
      "CEB": "5J", "GIA": "GA", "AIC": "AI", "UAE": "EK", "ETD": "EY",
      "QTR": "QR", "ELY": "LY", 
      "ASV": "RS", "ESR": "ZE", "AXM": "AK", "OMA": "WY", 
      "CBJ": "GS", "CBH": "JD", "CDG": "SC", "MXD": "OD", "LNI": "SL",
      "TTW": "IT", "ABL": "BX", "KOW": "RF", "THY": "TK",
      "UAL": "UA", "DAL": "DL", "AAL": "AA", "ETH": "ET",
      "ACA": "AC", "BAW": "BA", "VIR": "VS", "AFR": "AF", "DLH": "LH",
      "SWR": "LX", "AUA": "OS", "FIN": "AY", "KLM": "KL", "SAS": "SK",
      "ANZ": "NZ", "QFA": "QF", "JST": "JQ", "HAW": "HA", "RAM": "AT",
      "ITY": "AZ", "AMX": "AM", "CHH": "HU", "HX": "HX", "APZ": "YP"
    };
    
    let isStandby = false;
    let isPanelOpen = true;

    // --- セレクトボックスを外部JSデータから構築する関数 ---
    function generateDestinationOptions() {
      const selectEl = document.getElementById('destination');
      if (!selectEl || typeof DESTINATIONS_DATA === 'undefined') return;
      selectEl.innerHTML = ""; // 既存の中身をクリア

      DESTINATIONS_DATA.forEach(groupData => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = groupData.group;

        groupData.options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.value;
          option.setAttribute('data-en', opt.en);
          option.setAttribute('data-lat', opt.lat);
          option.setAttribute('data-lon', opt.lon);
          
          option.innerText = `${opt.value} (${opt.code})`;

          if (opt.selected) {
            option.selected = true;
          }

          optgroup.appendChild(option);
        });

        selectEl.appendChild(optgroup);
      });
    }

    function toggleAdminPanel() {
      isPanelOpen = !isPanelOpen;
      const panel = document.getElementById('adminPanel');
      const btn = document.getElementById('btnTogglePanel');
      if (isPanelOpen) {
        panel.classList.remove('collapsed');
        btn.innerText = "◀ パネルを閉じる";
      } else {
        panel.classList.add('collapsed');
        btn.innerText = "▶ パネルを開く";
      }
    }

    function toggleStandbyMode() {
      isStandby = !isStandby;
      const standbyScreen = document.getElementById('standbyScreen');
      const btn = document.getElementById('btnToggleMode');
      const airlineCode = document.getElementById('airline_code').value;

      if (isStandby) {
        standbyScreen.classList.remove('hidden');
        btn.innerText = "通常画面に戻す";
        setLogoSrc(document.getElementById('disp_standby_logo'), airlineCode);
      } else {
        standbyScreen.classList.add('hidden');
        btn.innerText = "準備中画面（ロゴ表示）に切り替え";
      }
    }

    function setLogoSrc(imgElement, code) {
      imgElement.dataset.airlineCode = code;
      imgElement.dataset.fallbackStep = "0";
      imgElement.src = `/web/logos/${code}.png`;
    }

    function handleLogoError(imgElement) {
      const code = imgElement.dataset.airlineCode || "JAL";
      let step = parseInt(imgElement.dataset.fallbackStep || "0", 10);

      if (step === 0) {
        imgElement.dataset.fallbackStep = "1";
        imgElement.src = `/web/logos/${code.toLowerCase()}.png`;
      } else if (step === 1) {
        imgElement.dataset.fallbackStep = "2";
        const iata = AIRLINE_PREFIX[code] || code;
        imgElement.src = `https://images.kiwi.com/airlines/64/${iata}.png`;
      } else {
        imgElement.src = `https://picsum.photos/seed/${code}/100/40`;
      }
    }

    function onDestinationChange() {
      sendUpdate();
    }

    async function fetchWeather(lat, lon) {
      if (!lat || !lon) return;
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
        const data = await response.json();
        
        if (data && data.current) {
          const temp = Math.round(data.current.temperature_2m);
          const wcode = data.current.weather_code;
          
          let maxTemp = temp + 3;
          let minTemp = temp - 3;
          if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_min) {
            maxTemp = Math.round(data.daily.temperature_2m_max[0]);
            minTemp = Math.round(data.daily.temperature_2m_min[0]);
          }

          document.getElementById('disp_weather_temp').innerText = `${maxTemp}°C`;
          document.getElementById('disp_weather_temp_min').innerText = `${minTemp}°C`;

          let icon = "☀️";
          if (wcode >= 1 && wcode <= 3) icon = "⛅";
          else if (wcode >= 45 && wcode <= 48) icon = "🌫️";
          else if (wcode >= 51 && wcode <= 67) icon = "🌧️";
          else if (wcode >= 71 && wcode <= 77) icon = "❄️";
          else if (wcode >= 95) icon = "⚡";

          document.getElementById('disp_weather_icon').innerText = icon;
        }
      } catch (e) {
        console.error("天気情報の取得に失敗しました", e);
      }
    }

    function sendUpdate() {
      // ゲート番号
      document.getElementById('disp_gate').innerText = document.getElementById('gate').value;

      // タイトル・ステータス
      const titleSelect = document.getElementById('title_select');
      const selectedOption = titleSelect.options[titleSelect.selectedIndex];
      const titleJa = selectedOption.value;
      const titleEn = selectedOption.getAttribute('data-en');
      
      document.getElementById('disp_title_ja').innerText = titleJa;
      document.getElementById('disp_title_en').innerText = titleEn;

      const titleBlock = document.getElementById('disp_title_block');
      if (titleJa === '搭乗中' || titleJa === '最終案内') {
        titleBlock.classList.add('status-yellow-blink');
        titleBlock.classList.remove('alert-text');
      } else if (titleJa === '出発遅延' || titleJa === '欠航' || titleJa === 'ゲート変更') {
        titleBlock.classList.add('alert-text');
        titleBlock.classList.remove('status-yellow-blink');
      } else {
        titleBlock.classList.remove('alert-text');
        titleBlock.classList.remove('status-yellow-blink');
      }

      // 行先
      const destSelect = document.getElementById('destination');
      const destOpt = destSelect.options[destSelect.selectedIndex];
      if (destOpt) {
        document.getElementById('disp_dest_ja').innerText = destOpt.value;
        document.getElementById('disp_dest_en').innerText = destOpt.getAttribute('data-en') || "";

        const lat = destOpt.getAttribute('data-lat');
        const lon = destOpt.getAttribute('data-lon');
        fetchWeather(lat, lon);
      }

      // 航空会社・便名（メイン ＆ コードシェア）
      const airlineCode = document.getElementById('airline_code').value;
      const flightNo = document.getElementById('flight_no').value;
      const coAirlineCode = document.getElementById('co_airline_code').value;
      const coFlightNo = document.getElementById('co_flight_no').value;

      const airlinePrefix = AIRLINE_PREFIX[airlineCode] || airlineCode;
      const flightsContainer = document.getElementById('disp_flights_container');
      
      let flightsHtml = `
        <div class="flight-group">
          <div class="airline-logo-box">
            <img src="/web/logos/${airlineCode}.png" data-airline-code="${airlineCode}" data-fallback-step="0" onerror="handleLogoError(this)" alt="${airlineCode}">
          </div>
          <span class="flight-number">${airlinePrefix}${flightNo}</span>
        </div>
      `;

      if (coAirlineCode && coFlightNo) {
        const coAirlinePrefix = AIRLINE_PREFIX[coAirlineCode] || coAirlineCode;
        flightsHtml += `
          <div class="flight-group">
            <div class="airline-logo-box">
              <img src="/web/logos/${coAirlineCode}.png" data-airline-code="${coAirlineCode}" data-fallback-step="0" onerror="handleLogoError(this)" alt="${coAirlineCode}">
            </div>
            <span class="flight-number">${coAirlinePrefix}${coFlightNo}</span>
          </div>
        `;
      }
      flightsContainer.innerHTML = flightsHtml;

      // 時刻・変更時刻
      const depTime = document.getElementById('departure_time').value;
      const changedTime = document.getElementById('changed_time').value;
      const timeContainer = document.getElementById('disp_time_container');

      if (changedTime) {
        timeContainer.innerHTML = `
          <span class="time-label">定刻</span>
          <span class="time-original has-change">${depTime}</span>
          <span class="time-arrow">→</span>
          <span class="time-changed-label">変更</span>
          <span class="time-changed-value">${changedTime}</span>
        `;
      } else {
        timeContainer.innerHTML = `
          <span class="time-label">定刻</span>
          <span class="time-original" id="disp_departure_time">${depTime}</span>
        `;
      }

      // お知らせメッセージ
      const noticeMsg = document.getElementById('notice_message').value;
      const noticeRow = document.getElementById('disp_notice_row');
      document.getElementById('disp_notice').innerText = noticeMsg;
      if (noticeMsg.trim() !== "") {
        noticeRow.classList.remove('hidden-notice');
      } else {
        noticeRow.classList.add('hidden-notice');
      }
    }

    // 時計の常時更新
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('disp_clock');
      if (clockEl) clockEl.innerText = `${hours}:${minutes}`;
    }

    // 起動時の処理
    window.onload = function() {
      generateDestinationOptions(); // 1. セレクトボックスを外部JSから構築
      sendUpdate();                 // 2. 画面を初期化・更新
      setInterval(updateClock, 1000); // 3. 時計の定期実行
      updateClock();
    };
  </script>
</body>
</html>
