<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Information Display System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- コントロールパネル -->
    <div id="control-panel">
        <h2>コントロールパネル</h2>
        
        <div class="section">
            <h3>リアルタイム自動取得 (FR24)</h3>
            <div class="form-group">
                <label>出発空港</label>
                <select id="select-airport">
                    <option value="HND">羽田 (HND)</option>
                    <option value="NRT">成田 (NRT)</option>
                    <option value="ITM">伊丹 (ITM)</option>
                    <option value="KIX">関西 (KIX)</option>
                    <option value="FUK">福岡 (FUK)</option>
                    <option value="CTS">新千歳 (CTS)</option>
                    <option value="NGO">中部 (NGO)</option>
                    <option value="OKA">沖縄/那覇 (OKA)</option>
                    <option value="HIJ">広島 (HIJ)</option>
                    <option value="KCZ">高知 (KCZ)</option>
                    <option value="MMJ">松本 (MMJ)</option>
                    <option value="KMJ">熊本 (KMJ)</option>
                    <option value="KOJ">鹿児島 (KOJ)</option>
                    <option value="SDJ">仙台 (SDJ)</option>
                    <option value="AOJ">青森 (AOJ)</option>
                    <option value="AKJ">旭川 (AKJ)</option>
                    <option value="HKD">函館 (HKD)</option>
                    <option value="MYJ">松山 (MYJ)</option>
                    <option value="NTQ">能登 (NTQ)</option>
                </select>
            </div>
            <div class="form-group">
                <label>対象ゲート</label>
                <input type="text" id="input-live-gate" value="5">
            </div>
            <button id="btn-fetch-live" class="btn-primary">⚡ リアルタイム情報を反映</button>
        </div>

        <div class="section">
            <h3>手動設定・調整</h3>
            <div class="form-group">
                <label>ゲート番号</label>
                <input type="text" id="manual-gate" value="5">
            </div>
            <div class="form-group">
                <label>案内タイトル</label>
                <select id="manual-title-ja">
                    <option value="搭乗ご案内 / BOARDING INFORMATION">搭乗ご案内 / BOARDING INFORMATION</option>
                    <option value="ご搭乗中 / NOW BOARDING">ご搭乗中 / NOW BOARDING</option>
                    <option value="出発遅延 / DELAYED">出発遅延 / DELAYED</option>
                    <option value="欠航 / CANCELLED">欠航 / CANCELLED</option>
                </select>
            </div>
            <div class="form-group">
                <label>行先 (全国の空港)</label>
                <select id="manual-dest-select">
                    <option value="大阪/伊丹|OSAKA/ITAMI">大阪/伊丹 (ITM)</option>
                    <option value="東京/羽田|TOKYO/HANEDA">東京/羽田 (HND)</option>
                    <option value="東京/成田|TOKYO/NARITA">東京/成田 (NRT)</option>
                    <option value="大阪/関西|OSAKA/KANSAI">大阪/関西 (KIX)</option>
                    <option value="福岡|FUKUOKA">福岡 (FUK)</option>
                    <option value="札幌/新千歳|SAPPORO/NEW CHITOSE">札幌/新千歳 (CTS)</option>
                    <option value="名古屋/中部|NAGOYA/CENTRAIR">名古屋/中部 (NGO)</option>
                    <option value="沖縄/那覇|OKINAWA/NAHA">沖縄/那覇 (OKA)</option>
                    <option value="能登|NOTO">能登 (NTQ)</option>
                    <option value="広島|HIROSHIMA">広島 (HIJ)</option>
                    <option value="高知|KOCHI">高知 (KCZ)</option>
                    <option value="松本|MATSUMOTO">松本 (MMJ)</option>
                    <option value="熊本|KUMAMOTO">熊本 (KMJ)</option>
                    <option value="鹿児島|KAGOSHIMA">鹿児島 (KOJ)</option>
                    <option value="仙台|SENDAI">仙台 (SDJ)</option>
                    <option value="青森|AOMORI">青森 (AOJ)</option>
                    <option value="旭川|ASAHIKAWA">旭川 (AKJ)</option>
                    <option value="函館|HAKODATE">函館 (HKD)</option>
                    <option value="松山|MATSUYAMA">松山 (MYJ)</option>
                </select>
            </div>
            <div class="form-group">
                <label>航空会社</label>
                <select id="manual-airline">
                    <option value="ANA">全日本空輸 (ANA)</option>
                    <option value="JAL">日本航空 (JAL)</option>
                    <option value="SKY">スカイマーク (SKY)</option>
                    <option value="ADO">AIRDO (ADO)</option>
                    <option value="SNJ">ソラシドエア (SNJ)</option>
                    <option value="SFJ">スターフライヤー (SFJ)</option>
                    <option value="FDA">フジドリームエアラインズ (FDA)</option>
                </select>
            </div>
            <div class="form-group">
                <label>便名 (数字)</label>
                <input type="text" id="manual-flight-no" value="420">
            </div>
            <div class="form-group">
                <label>定刻 (STD)</label>
                <input type="text" id="manual-dep-time" value="07:10">
            </div>
            <div class="form-group">
                <label>搭乗開始予定</label>
                <input type="text" id="manual-board-time" value="06:50">
            </div>
            
            <hr style="border: 0; border-top: 1px solid #30363d; margin: 15px 0;">

            <div class="form-group">
                <label>天気マーク</label>
                <input type="text" id="manual-weather-icon" value="☀️☁️">
            </div>
            <div class="form-group">
                <label>気温</label>
                <input type="text" id="manual-weather-temp" value="21°C">
            </div>
            <div class="form-group">
                <label>日付</label>
                <input type="text" id="manual-weather-date" value="8月25日">
            </div>

            <button id="btn-manual-update" class="btn-secondary">手動設定を案内にする</button>
        </div>
    </div>

    <!-- メイン表示領域 -->
    <div id="display-board">
        <div class="header">
            <div class="gate-container">
                <span class="gate-label">GATE</span>
                <span class="gate-value" id="disp-gate">5</span>
            </div>
            <div class="title-container">
                <h1 id="disp-title-ja">搭乗ご案内</h1>
                <h2 id="disp-title-en">BOARDING INFORMATION</h2>
            </div>
            <div class="clock-container">
                <span id="disp-clock">00:00</span>
            </div>
        </div>

        <div class="main-content">
            <div class="destination-container">
                <span class="dest-ja" id="disp-dest-ja">大阪/伊丹</span>
                <span class="dest-en" id="disp-dest-en">OSAKA/ITAMI</span>
            </div>
            
            <div class="flight-container">
                <span class="airline-logo" id="disp-airline">ANA</span>
                <span class="flight-no" id="disp-flight-no">ANA420</span>
            </div>

            <div class="weather-container">
                <span class="weather-icon" id="disp-weather-icon">☀️☁️</span>
                <span class="weather-temp" id="disp-weather-temp">21°C</span>
                <span class="weather-date" id="disp-weather-date">8月25日</span>
            </div>
        </div>

        <div class="footer">
            <div class="time-box">
                <span class="time-label">定刻 / Scheduled</span>
                <span class="time-value" id="disp-dep-time">07:10</span>
            </div>
            <div class="time-box">
                <span class="time-label">搭乗開始予定 / Scheduled Boarding</span>
                <span class="time-value" id="disp-board-time">06:50</span>
            </div>
        </div>
    </div>

    <script>
        // 時計更新機能
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const clockEl = document.getElementById("disp-clock");
            if (clockEl) clockEl.innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 画面（DOM）の表示データを更新する統一関数
        function updateUI(data) {
            if (!data) return;
            const setTxt = (id, val) => {
                const el = document.getElementById(id);
                if (el && val !== undefined && val !== null) el.innerText = val;
            };

            setTxt("disp-gate", data.gate);
            setTxt("disp-title-ja", data.title_ja);
            setTxt("disp-title-en", data.title_en);
            setTxt("disp-dest-ja", data.destination_ja);
            setTxt("disp-dest-en", data.destination_en);
            setTxt("disp-airline", data.airline_code);
            setTxt("disp-flight-no", data.flight_no);
            setTxt("disp-dep-time", data.departure_time);
            setTxt("disp-board-time", data.boarding_time);
            setTxt("disp-weather-icon", data.weather_icon);
            setTxt("disp-weather-temp", data.weather_temp);
            setTxt("disp-weather-date", data.weather_date);
        }

        // ⚡ リアルタイム情報反映ボタンの処理
        const btnFetch = document.getElementById("btn-fetch-live");
        if (btnFetch) {
            btnFetch.addEventListener("click", async () => {
                const airportCode = document.getElementById("select-airport")?.value || "HND";
                const gateNum = document.getElementById("input-live-gate")?.value || "5";

                try {
                    const res = await fetch("/api/fetch-live-flight", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ airport_code: airportCode, gate_number: gateNum })
                    });
                    const result = await res.json();

                    if (result.status === "success") {
                        updateUI(result.data);
                        alert("リアルタイム情報を反映しました！");
                    } else {
                        alert("通知: " + result.message);
                    }
                } catch (e) {
                    alert("通信エラーが発生しました: " + e);
                }
            });
        }

        // 🛠 手動設定反映ボタンの処理
        const btnManual = document.getElementById("btn-manual-update");
        if (btnManual) {
            btnManual.addEventListener("click", async () => {
                // 行先セレクトの値を分割 (日本語|英語)
                const destVal = document.getElementById("manual-dest-select")?.value || "|";
                const [destJa, destEn] = destVal.split("|");

                // タイトルセレクトの値を分割 (日本語 / 英語)
                const titleVal = document.getElementById("manual-title-ja")?.value || " / ";
                const [titleJa, titleEn] = titleVal.split(" / ");

                const airlineCode = document.getElementById("manual-airline")?.value || "ANA";
                const flightNumOnly = document.getElementById("manual-flight-no")?.value || "100";

                const manualData = {
                    gate: document.getElementById("manual-gate")?.value,
                    title_ja: titleJa,
                    title_en: titleEn,
                    destination_ja: destJa,
                    destination_en: destEn,
                    airline_code: airlineCode,
                    flight_no: airlineCode + flightNumOnly,
                    departure_time: document.getElementById("manual-dep-time")?.value,
                    boarding_time: document.getElementById("manual-board-time")?.value,
                    weather_icon: document.getElementById("manual-weather-icon")?.value,
                    weather_temp: document.getElementById("manual-weather-temp")?.value,
                    weather_date: document.getElementById("manual-weather-date")?.value
                };

                try {
                    const res = await fetch("/api/update-flight-data", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(manualData)
                    });
                    const result = await res.json();
                    updateUI(result);
                    alert("手動設定を案内画面に反映しました！");
                } catch (e) {
                    alert("更新エラー: " + e);
                }
            });
        }

        // 初期データ読み込み
        fetch("/api/flight-data")
            .then(res => res.json())
            .then(data => updateUI(data));
    </script>
</body>
</html>
