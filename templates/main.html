<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フライト案内板システム</title>
  <style>
    /* 基本スタイリング */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #0b132b;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #1c2541;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      color: #4ea8de;
      border-bottom: 2px solid #3a506b;
      padding-bottom: 10px;
    }

    /* 制御パネル */
    .control-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background-color: #4ea8de;
      color: #0b132b;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #64dfdf;
    }

    /* フライト情報表示エリア */
    .board {
      background-color: #0b132b;
      border: 2px solid #3a506b;
      border-radius: 8px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .board-item {
      display: flex;
      flex-direction: column;
      background: #1c2541;
      padding: 12px;
      border-radius: 6px;
    }

    .label {
      font-size: 0.85rem;
      color: #8d99ae;
      margin-bottom: 4px;
    }

    .value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #f77f00;
    }

    .status {
      grid-column: span 2;
      text-align: center;
      font-size: 1.4rem;
      color: #e76f51;
      background: #2b2d42;
      padding: 10px;
      border-radius: 6px;
    }

    /* スタンバイ（準備中）画面 */
    .standby-screen {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .standby-screen img {
      max-width: 150px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>FLIGHT INFORMATION</h1>

    <!-- 操作パネル -->
    <div class="control-panel">
      <button onclick="fetch_live_flight()">最新データ手動取得 (Live Fetch)</button>
      <button onclick="toggleStandbyMode()">準備中モード切替</button>
    </div>

    <!-- フライト案内板（メイン表示） -->
    <div id="flight-board" class="board">
      <div class="board-item">
        <span class="label">AIRLINE / 航空会社</span>
        <span id="airline" class="value">---</span>
      </div>
      <div class="board-item">
        <span class="label">FLIGHT NO / 便名</span>
        <span id="flight-no" class="value">---</span>
      </div>
      <div class="board-item">
        <span class="label">DESTINATION / 行き先</span>
        <span id="destination" class="value">---</span>
      </div>
      <div class="board-item">
        <span class="label">DEPARTURE / 定刻</span>
        <span id="departure-time" class="value">--:--</span>
      </div>
      <div class="board-item">
        <span class="label">GATE / 登機口</span>
        <span id="gate" class="value">--</span>
      </div>
      <div class="board-item">
        <span class="label">UPDATED AT / 更新時刻</span>
        <span id="last-updated" class="value">--:--:--</span>
      </div>
      <div class="status">
        STATUS: <span id="flight-status">---</span>
      </div>
    </div>

    <!-- 準備中画面 -->
    <div id="standby-screen" class="standby-screen">
      <img id="airline-logo" src="" alt="Airline Logo" style="display:none;">
      <h2>只今、ご案内準備中です</h2>
      <p>Please wait for the next flight update.</p>
    </div>
  </div>

  <script>
    // ページロード時の自動取得処理
    window.onload = function() {
      loadFlightData();
    };

    /**
     * 1. サーバーから最新のフライトデータを取得し、画面のDOMを書き換える関数
     */
    function loadFlightData() {
      fetch('/api/get_current_flight')
        .then(response => {
          if (!response.ok) {
            throw new Error('データの取得に失敗しました');
          }
          return response.json();
        })
        .then(data => {
          // 画面（DOM）の表示内容を書き換える
          updateDOM(data);
        })
        .catch(error => {
          console.error('loadFlightData エラー:', error);
        });
    }

    /**
     * 2. 外部API/ライブデータ取得を実行した後、画面を再描画する関数
     */
    function fetch_live_flight() {
      console.log('ライブデータを取得中...');

      fetch('/api/fetch_live_flight', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('ライブデータの取得リクエストに失敗しました');
        }
        return response.json();
      })
      .then(data => {
        console.log('ライブデータ取得完了:', data);

        // ★【重要】ここで最新データをDOMに直接反映する（または loadFlightData() を再度呼ぶ）
        if (data && Object.keys(data).length > 0) {
          updateDOM(data);
        } else {
          loadFlightData();
        }

        alert('最新のフライト情報を取得・更新したわ！');
      })
      .catch(error => {
        console.error('fetch_live_flight エラー:', error);
        alert('最新データの取得に失敗しちゃったみたい。');
      });
    }

    /**
     * 3. 取得したデータに基づいてDOMを書き換える共通関数
     */
    function updateDOM(data) {
      document.getElementById('airline').innerText = data.airline || '---';
      document.getElementById('flight-no').innerText = data.flight_no || '---';
      document.getElementById('destination').innerText = data.destination || '---';
      document.getElementById('departure-time').innerText = data.departure_time || '--:--';
      document.getElementById('gate').innerText = data.gate || '--';
      document.getElementById('flight-status').innerText = data.status || '---';

      // 現在の更新時刻を設定
      const now = new Date();
      document.getElementById('last-updated').innerText = now.toLocaleTimeString();

      // ロゴの設定（存在する場合）
      const logoImg = document.getElementById('airline-logo');
      if (data.logo_url) {
        logoImg.src = data.logo_url;
        logoImg.style.display = 'inline-block';
      } else {
        logoImg.style.display = 'none';
      }
    }

    /**
     * 4. 準備中画面の切り替え
     */
    function toggleStandbyMode() {
      const board = document.getElementById('flight-board');
      const standby = document.getElementById('standby-screen');

      if (board.style.display === 'none') {
        board.style.display = 'grid';
        standby.style.display = 'none';
      } else {
        board.style.display = 'none';
        standby.style.display = 'block';
      }
    }
  </script>
</body>
</html>
